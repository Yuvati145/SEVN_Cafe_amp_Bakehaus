P.story=()=>`<section class="hb"><div class="pic">${IMG('photo-1555507036-ab1f4038808a','The bakehaus at five in the morning')}</div><div>${BADGE}<h1>Our story</h1><p class="body" style="margin:14px auto 0;opacity:.9">Rooted in craftsmanship. Guided by simplicity.</p><a class="btn ol" href="#/menu">See the menu</a></div></section>

P.partner=()=>`<section class="sp2">${PIC('photo-1559925393-8be0ec4767c8','The SEVN storefront at dusk with the blade sign lit')}<div><h1>BRING SEVN TO YOUR CITY.</h1><p class="body">Interested in building a SEVN of your own? We're looking to grow with people who believe in good food, thoughtful hospitality and places people genuinely want to return to.</p><a class="btn" href="#" data-sc="inq">Start an inquiry →</a> &nbsp; <a class="lk" href="#" data-sc="how">How it works</a></div></section>
<section class="band"><div class="wrap g2" style="display:grid;grid-template-columns:1fr 1fr;gap:clamp(24px,6vw,100px)" id="why"><h2>MORE THAN OPENING A CAFÉ.</h2><p class="body">SEVN is a complete experience, not a menu with a logo on it. Food, coffee, design, hospitality, community and consistency are developed as one system — and a SEVN in another city has to arrive with all six intact. That is what a partner takes on, and it is what makes the brand worth taking on.</p></div><div class="wrap wd"><span>Food</span><span>Coffee</span><span>Design</span><span>Hospitality</span><span>Community</span><span>Consistency</span></div></section>
<section class="band cr"><div class="wrap"><h2 style="margin-bottom:30px">Why SEVN</h2>${[['A distinct brand','A recognisable identity built to stay consistent across every touchpoint.'],['A considered experience','Food, coffee, design and hospitality working as one system.'],['Built for community',"A café intended to become part of people's everyday routines."],['A system that can grow','A clear operating and brand framework that translates across locations.']].map(r=>`<div class="pl"><h3>${r[0]}</h3><p class="body">${r[1]}</p></div>`).join('')}</div></section>

<section class="band" id="how"><div class="wrap"><h2>How it works</h2><div class="tl">${[['Inquire','Tell us about yourself, your city and what you\'re looking to build.'],['Connect','If there looks to be a fit, the SEVN team gets in touch for a first conversation.'],['Explore','Market, location, operating expectations and commercial requirements.'],['Align','Confirm whether the opportunity works for both sides.'],['Build','Location planning, brand implementation, setup and launch.']].map((s,i)=>`<div><p class="lb">0${i+1}</p><h3>${s[0]}</h3><p>${s[1]}</p></div>`).join('')}</div></div></section>
